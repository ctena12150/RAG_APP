[project]
name = "rag-service"
version = "1.0.0"
description = "Servicio RAG agéntico de Evidentia (FastAPI + LangChain + pgvector)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 desactivado: los prompts y comentarios en español son prosa y no se parten mecánicamente
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
