# Proxy del frontend (Evidentia·RAG): sirve el build de Vite y reenvía /api al
# backend .NET. Es una PLANTILLA procesada por envsubst al arrancar el contenedor
# (entrypoint de la imagen oficial): sustituye ${APP_ACCESS_KEY}; las variables
# nativas de nginx ($host, $remote_addr…) no se tocan.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # coincide con Uploads:MaxSizeBytes del backend (25 MiB)
    client_max_body_size 26m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- API del backend .NET (incluye el SSE del chat) ---
    location /api/ {
        # re-resolución DNS en runtime: si el contenedor backend cambia de IP, no hay 502
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keepalive hacia el upstream: no reenviar el Connection del cliente
        proxy_set_header Connection "";

        # clave opcional de acceso: con valor vacío nginx OMITE el header y el
        # backend (Security:AppAccessKey vacío) no lo exige
        proxy_set_header X-App-Access-Key "${APP_ACCESS_KEY}";

        # SSE: sin buffering y con timeouts holgados (el relay SSE puede tardar minutos)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # assets con hash de Vite: caché inmutable
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html siempre fresco (referencia los assets hasheados)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
